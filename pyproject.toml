[project]
name = "asos-store"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paprika", email = "doginnet@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.3",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rich>=15.0.0",
]

[project.scripts]
asos-store = "asos_store:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
